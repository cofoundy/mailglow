<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>mailglow</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%2240 80 432 380%22%3E%3Cdefs%3E %3CradialGradient id=%22mg-sun%22 cx=%2250%25%22 cy=%2275%25%22 r=%2270%25%22%3E %3Cstop offset=%220%22 stop-color=%22#FFF1C9%22/%3E %3Cstop offset=%22.45%22 stop-color=%22#FFC56B%22/%3E %3Cstop offset=%221%22 stop-color=%22#FF8A3D%22/%3E %3C/radialGradient%3E %3CradialGradient id=%22mg-halo%22 cx=%22256%22 cy=%22262%22 r=%22190%22 gradientUnits=%22userSpaceOnUse%22%3E %3Cstop offset=%220%22 stop-color=%22#FF9F4A%22 stop-opacity=%22.95%22/%3E %3Cstop offset=%22.55%22 stop-color=%22#FF7A3D%22 stop-opacity=%22.35%22/%3E %3Cstop offset=%221%22 stop-color=%22#FF7A3D%22 stop-opacity=%220%22/%3E %3C/radialGradient%3E %3CclipPath id=%22mg-back%22%3E%3Cpath d=%22M60 214 L236 112 Q256 100 276 112 L452 214 V410 Q452 440 422 440 H90 Q60 440 60 410 Z%22/%3E%3C/clipPath%3E %3C/defs%3E %3Cpath fill=%22#232C63%22 d=%22M60 214 L236 112 Q256 100 276 112 L452 214 V410 Q452 440 422 440 H90 Q60 440 60 410 Z%22/%3E %3Cg clip-path=%22url%28#mg-back%29%22%3E %3Ccircle cx=%22256%22 cy=%22262%22 r=%22190%22 fill=%22url%28#mg-halo%29%22/%3E %3Ccircle cx=%22256%22 cy=%22262%22 r=%2292%22 fill=%22url%28#mg-sun%29%22/%3E %3C/g%3E %3Cpath fill=%22#232C63%22 d=%22M60 226 L244 330 Q256 337 268 330 L452 226 V410 Q452 440 422 440 H90 Q60 440 60 410 Z%22/%3E %3Cpath d=%22M66 224 L244 324 Q256 331 268 324 L446 224%22 fill=%22none%22 stroke=%22#FFD58F%22 stroke-width=%229%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* ── tokens ─────────────────────────────────────────────────────────────── */
:root{
  --font:"Geist",ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --display:"Instrument Serif","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --ios:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",var(--font);

  --bg:#f5f4f0; --panel:#ffffff; --panel-2:#faf9f7; --sunken:#eeece7; --raised:#ffffff;
  --line:rgba(28,25,20,.10); --line-2:rgba(28,25,20,.06); --dot:rgba(28,25,20,.09);
  --ink:#16151a; --ink-2:#55524c; --ink-3:#8b877f; --ink-4:#b4b0a8;
  --hover:rgba(28,25,20,.045); --press:rgba(28,25,20,.08);
  --accent:#3d5afe; --accent-ink:#fff; --sel:#eef1ff; --sel-line:rgba(61,90,254,.22);
  --err:#dc3d43; --warn:#d97706; --ok:#2f9e63; --info:#6e56cf;
  --err-bg:rgba(220,61,67,.08); --warn-bg:rgba(217,119,6,.09); --ok-bg:rgba(47,158,99,.09); --info-bg:rgba(110,86,207,.08);
  --shadow-sm:0 1px 1px rgba(28,25,20,.04),0 1px 3px rgba(28,25,20,.07);
  --shadow:0 1px 2px rgba(28,25,20,.05),0 6px 16px -4px rgba(28,25,20,.08),0 24px 48px -16px rgba(28,25,20,.12);
  --shadow-lg:0 2px 4px rgba(0,0,0,.06),0 16px 40px -8px rgba(0,0,0,.18),0 40px 80px -24px rgba(0,0,0,.22);
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0d0d0f; --panel:#131316; --panel-2:#18181c; --sunken:#09090a; --raised:#1c1c21;
  --line:rgba(255,255,255,.085); --line-2:rgba(255,255,255,.05); --dot:rgba(255,255,255,.055);
  --ink:#ededf0; --ink-2:#a9a9b1; --ink-3:#74747c; --ink-4:#4d4d55;
  --hover:rgba(255,255,255,.045); --press:rgba(255,255,255,.08);
  --accent:#7c8cff; --accent-ink:#0b0e24; --sel:rgba(124,140,255,.12); --sel-line:rgba(124,140,255,.30);
  --err:#ff6b70; --warn:#f5b441; --ok:#4cd68f; --info:#a592ff;
  --err-bg:rgba(255,107,112,.10); --warn-bg:rgba(245,180,65,.10); --ok-bg:rgba(76,214,143,.10); --info-bg:rgba(165,146,255,.10);
  --shadow-sm:0 1px 2px rgba(0,0,0,.5);
  --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 32px -8px rgba(0,0,0,.55);
  --shadow-lg:0 2px 4px rgba(0,0,0,.4),0 24px 60px -12px rgba(0,0,0,.7);
  color-scheme:dark;
}}
:root[data-theme=dark]{
  --bg:#0d0d0f; --panel:#131316; --panel-2:#18181c; --sunken:#09090a; --raised:#1c1c21;
  --line:rgba(255,255,255,.085); --line-2:rgba(255,255,255,.05); --dot:rgba(255,255,255,.055);
  --ink:#ededf0; --ink-2:#a9a9b1; --ink-3:#74747c; --ink-4:#4d4d55;
  --hover:rgba(255,255,255,.045); --press:rgba(255,255,255,.08);
  --accent:#7c8cff; --accent-ink:#0b0e24; --sel:rgba(124,140,255,.12); --sel-line:rgba(124,140,255,.30);
  --err:#ff6b70; --warn:#f5b441; --ok:#4cd68f; --info:#a592ff;
  --err-bg:rgba(255,107,112,.10); --warn-bg:rgba(245,180,65,.10); --ok-bg:rgba(76,214,143,.10); --info-bg:rgba(165,146,255,.10);
  --shadow-sm:0 1px 2px rgba(0,0,0,.5);
  --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 32px -8px rgba(0,0,0,.55);
  --shadow-lg:0 2px 4px rgba(0,0,0,.4),0 24px 60px -12px rgba(0,0,0,.7);
  color-scheme:dark;
}

/* ── base ───────────────────────────────────────────────────────────────── */
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:13.5px/1.45 var(--font);font-feature-settings:"ss01","cv11";-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
kbd{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;font:500 10.5px/1 var(--mono);color:var(--ink-2);background:var(--panel);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px}
code{font-family:var(--mono);font-size:.92em}
.spacer{flex:1}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

.app{display:grid;grid-template-columns:224px 364px minmax(0,1fr);height:100vh;height:100dvh}
.app.focus{grid-template-columns:minmax(0,1fr)}
.app.focus .rail,.app.focus .list{display:none}
.app.focus .reader{margin-top:0}
.focusbtn{flex:none;margin-right:2px}
.app.focus .focusbtn{color:var(--accent)}

/* ── rail ───────────────────────────────────────────────────────────────── */
.rail{display:flex;flex-direction:column;padding:14px 10px 12px;min-height:0;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 0}
.mark{width:30px;height:30px;flex:none;filter:drop-shadow(0 2px 6px rgba(255,138,61,.35))}
:root[data-theme=dark] .mark{--mg-ink:#2E3878}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .mark{--mg-ink:#2E3878}}
.mark svg{display:block;width:100%;height:100%}
.wm{font:400 23px/1 var(--display);letter-spacing:-.01em;white-space:nowrap}
.wm em{font-style:italic}
.wm .hy{color:var(--ink-3);margin:0 1px}
.where{display:flex;align-items:center;gap:7px;margin:14px 4px 16px;padding:7px 10px;border:1px solid var(--line-2);border-radius:9px;background:var(--panel-2);color:var(--ink-2);min-width:0}
.where .i{width:14px;height:14px;color:var(--ink-3)}
.where span{font:12px/1 var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.where span[data-icon]{flex:none;overflow:visible;display:inline-flex}
.navlbl{font:600 10.5px/1 var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:6px 10px 8px}
.nav{display:flex;flex-direction:column;gap:1px}
.nav button{display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:8px;color:var(--ink-2);font-weight:500;transition:background .12s,color .12s}
.nav button:hover{background:var(--hover);color:var(--ink)}
.nav button[aria-current=true]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow-sm)}
.nav button .i{color:var(--ink-3)}
.nav button[aria-current=true] .i{color:var(--accent)}
.nav .n{margin-left:auto;font:500 11.5px/1 var(--mono);color:var(--ink-3);font-variant-numeric:tabular-nums}
.nav .n.hot{color:var(--err)}
.nav .lbl{white-space:nowrap}
.rail-foot{margin-top:auto;display:flex;align-items:center;gap:4px;padding:8px 4px 0;border-top:1px solid var(--line-2)}
.live{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-3);padding:0 6px;white-space:nowrap;overflow:hidden}
.live i{width:7px;height:7px;border-radius:50%;background:var(--ink-4);flex:none;position:relative}
.live.on i{background:var(--ok)}
.live.on i::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:1.5px solid var(--ok);opacity:0;animation:ping 2.4s var(--ease) infinite}
@keyframes ping{0%{transform:scale(.6);opacity:.7}80%,100%{transform:scale(1.6);opacity:0}}
.ibtn{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;color:var(--ink-2);transition:background .12s,color .12s,transform .12s}
.ibtn:hover{background:var(--hover);color:var(--ink)}
.ibtn:active{transform:scale(.94)}
.ibtn[disabled]{opacity:.35;pointer-events:none}

/* ── list ───────────────────────────────────────────────────────────────── */
.list{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-left:1px solid var(--line);border-right:1px solid var(--line);border-radius:14px 0 0 0;margin-top:8px;box-shadow:-1px 0 0 var(--line-2)}
.list-head{display:flex;align-items:baseline;gap:8px;padding:18px 18px 12px}
.list-head h2{margin:0;font:600 17px/1.1 var(--font);letter-spacing:-.015em}
.list-head .count{font:500 12px/1 var(--mono);color:var(--ink-3)}
.search{display:flex;align-items:center;gap:8px;margin:0 12px 8px;height:34px;padding:0 10px;border-radius:9px;background:var(--panel-2);border:1px solid var(--line-2);color:var(--ink-3);transition:border-color .12s,box-shadow .12s,background .12s}
.search:focus-within{background:var(--panel);border-color:var(--sel-line);box-shadow:0 0 0 3px var(--sel)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font:inherit}
.search input::placeholder{color:var(--ink-3)}
.items{overflow:auto;flex:1;padding:2px 8px 20px;scrollbar-width:thin}
.item{position:relative;display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;padding:12px 12px 12px 14px;border-radius:11px;cursor:pointer;transition:background .12s}
.item+.item{margin-top:1px}
.item:hover{background:var(--hover)}
.item.sel{background:var(--sel);box-shadow:inset 0 0 0 1px var(--sel-line)}
.item::before{content:"";position:absolute;left:4px;top:19px;width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:0;transform:scale(.4);transition:opacity .15s,transform .15s}
.item.unread::before{opacity:1;transform:none}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:600 12.5px/1 var(--font);color:#fff;letter-spacing:.02em;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18),0 1px 2px rgba(0,0,0,.12);text-shadow:0 1px 1px rgba(0,0,0,.12)}
.r1{display:flex;align-items:baseline;gap:8px}
.from{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:500;color:var(--ink-2)}
.item.unread .from{font-weight:600;color:var(--ink)}
.when{font:500 11.5px/1 var(--font);color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.item.unread .when{color:var(--accent)}
.subj{margin-top:3px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:500;color:var(--ink);letter-spacing:-.005em}
.item.unread .subj{font-weight:600}
.pre{margin-top:2px;color:var(--ink-3);font-size:12.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.status{display:inline-flex;align-items:center;gap:6px;font-weight:500}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 16%,transparent)}
.status.none{color:var(--ink-4)} .status.ok{color:var(--ok)} .status.warn{color:var(--warn)} .status.err{color:var(--err)}
.stack{display:inline-flex;align-items:center;gap:5px}
.stack .i{width:13px;height:13px}
.picked{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-weight:600}
.picked .i{width:12px;height:12px;fill:currentColor}
.grp-h{display:flex;align-items:center;gap:6px;margin:14px 8px 4px;font:600 10.5px/1 var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.grp-h .i{width:12px;height:12px}
.grp-h:first-child{margin-top:4px}
.list-empty{padding:40px 18px;text-align:center;color:var(--ink-3)}
.list-empty b{display:block;color:var(--ink);font-weight:600;margin-bottom:4px}

/* ── reader: header + toolbar over the stage, review column on the right ── */
.reader{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 280px;grid-template-rows:auto auto auto auto auto minmax(0,1fr);grid-template-areas:"mbar side" "head side" "tool side" "strip side" "mnote side" "stage side";min-width:0;min-height:0;background:var(--panel);margin-top:8px;transition:grid-template-columns .22s var(--ease)}
.reader.linting{grid-template-columns:minmax(0,1fr) 440px}
.reader.bare{grid-template-columns:minmax(0,1fr) 0px}
.reader.bare .side,.reader.bare .strip,.reader.bare .mnote{display:none!important}
.boot .reader{transition:none}
.mbar{display:none;grid-area:mbar}
.rhead{grid-area:head}
.toolbar{grid-area:tool}
.strip{display:none;grid-area:strip}
.mnote{display:none;grid-area:mnote}
.stage{grid-area:stage}
.side{grid-area:side}
.rhead{padding:14px 24px 8px}
.rtop{display:flex;align-items:flex-start;gap:16px}
.rsubj{flex:1;min-width:0;margin:0;font:600 19px/1.3 var(--font);letter-spacing:-.022em;text-wrap:balance}
.rnav{display:flex;gap:2px;margin-top:-2px}
.rfrom{display:flex;align-items:center;gap:10px;margin-top:8px;min-width:0}
.rfrom .av{width:26px;height:26px;font-size:10.5px}
.rmeta{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-3);font-size:12.5px}
.rmeta .nm{font-weight:600;color:var(--ink);font-size:13.5px}
.rmeta .addr{color:var(--ink-3);margin-left:4px}
.rmeta .to::before{content:"·";margin:0 6px;color:var(--ink-4)}
.rdate{color:var(--ink-3);font-size:12.5px;white-space:nowrap}
.facts{display:flex;gap:6px;flex:none}
.fact{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:6px;background:var(--panel-2);border:1px solid var(--line-2);color:var(--ink-2);font:500 11.5px/1 var(--mono);white-space:nowrap}
.fact .i{width:12px;height:12px;color:var(--ink-3)}
.fact.warn{color:var(--warn);background:var(--warn-bg);border-color:transparent}

.toolbar{display:flex;align-items:center;gap:8px;padding:6px 20px 10px 22px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.toolbar::-webkit-scrollbar{display:none}
.seg{display:inline-flex;flex:none;gap:1px;padding:2px;border-radius:10px;background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line-2)}
.seg[hidden]{display:none}
.seg button{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 8px;border-radius:8px;color:var(--ink-3);font-weight:500;font-size:12.5px;white-space:nowrap;transition:background .12s,color .12s,box-shadow .12s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--raised);color:var(--ink);box-shadow:0 1px 1px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.08),inset 0 0 0 .5px var(--line)}
.seg button[aria-pressed=true] .i{color:var(--accent)}
.seg button .i{width:15px;height:15px}
.seg button .lbl{display:none}
.seg button[aria-pressed=true]{padding:0 11px 0 9px}
.seg button[aria-pressed=true] .lbl{display:inline}
.seg.txt button,.seg.txt button[aria-pressed=true]{padding:0 10px 0 8px}
.seg.txt button .lbl{display:inline}
.readout{flex:none;display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 4px;font:500 11.5px/1 var(--mono);color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.readout b{color:var(--ink-2);font-weight:500}
.readout.true .pc{color:var(--accent)}
.readout .sep{color:var(--ink-4)}

/* ── stage: the email is the only thing in it ───────────────────────────── */
.stage{position:relative;overflow:auto;min-height:0;padding:20px 28px 28px;background-color:var(--sunken);background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:18px 18px;background-position:-4px -4px;scrollbar-width:thin;overscroll-behavior:contain}
.lanes{position:relative;display:flex;justify-content:center;align-items:flex-start}
.lane{display:flex;flex-direction:column;min-width:0;animation:rise .22s var(--ease)}
.lane:not(.on){position:absolute;left:0;top:0;visibility:hidden;pointer-events:none;animation:none}
.cue{display:flex;justify-content:space-between;gap:12px;margin:0 1px 8px;font:500 10.5px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-variant-numeric:tabular-nums}
.cue b{font-weight:500;color:var(--ink-2)}
.box{position:relative;overflow:hidden;background:#fff;border-radius:12px;box-shadow:var(--shadow);transition:width .18s var(--ease),height .18s var(--ease)}
.boot .box,.box:not(.ready){transition:none}
.box iframe{position:absolute;left:0;top:0;display:block;border:0;background:#fff;transform-origin:0 0}
.box .ld{position:absolute;inset:0;display:grid;place-items:center;background:var(--panel-2)}
.box.ready .ld{display:none}
.lane.mob .box{border-radius:3px;box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(28,25,20,.04)}
.dark-client .box,.dark-client .box iframe{background:#121212}
.dark-client .box .ld{background:#121212}
.dark-client .lane:not(.mob) .box{box-shadow:var(--shadow),inset 0 0 0 1px rgba(255,255,255,.06)}
@keyframes rise{from{transform:translateY(6px)}to{transform:none}}

/* compare */
.cmp-note{max-width:720px;margin:0 auto 16px;padding:10px 14px;border-radius:10px;background:var(--panel);border:1px dashed var(--line);color:var(--ink-2);font-size:12.5px;text-align:center}
.cmp{display:flex;gap:24px;justify-content:center;align-items:flex-start;width:max-content;margin:0 auto;animation:rise .22s var(--ease)}
.col{flex:none;display:flex;flex-direction:column;gap:10px;width:calc(var(--w) * var(--z,1))}
.col .frame{width:var(--w);zoom:var(--z,1)}
.col-head{display:flex;align-items:center;gap:10px;padding:6px;border-radius:12px;cursor:pointer;transition:background .12s}
.col-head:hover{background:var(--hover)}
.vbadge{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--panel);box-shadow:var(--shadow-sm),inset 0 0 0 1px var(--line);font:400 20px/1 var(--display);text-transform:uppercase}
.col.on .vbadge{background:var(--ink);color:var(--panel);box-shadow:none}
.col-head .status{font-size:12px}
.col-sub{margin:-4px 6px 0;font-weight:600;font-size:13px;letter-spacing:-.01em;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pickbtn,.vpick{flex:none;display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 11px 0 9px;border-radius:999px;border:1px solid var(--line);background:var(--raised);font-weight:600;font-size:12px;color:var(--ink-2);box-shadow:var(--shadow-sm);transition:color .12s,border-color .12s,transform .12s,box-shadow .12s}
.pickbtn:hover,.vpick:hover{color:var(--ink);border-color:var(--ink-4)}
.pickbtn:active,.vpick:active{transform:scale(.95)}
.pickbtn .i,.vpick .i{width:13px;height:13px}
.pickbtn.on,.vpick.on{border-color:transparent;color:#fff;background:linear-gradient(135deg,#ff8a4c,#ff4d7e 55%,#7b5cff);box-shadow:0 4px 14px -4px rgba(255,77,126,.6)}
.pickbtn.on .i,.vpick.on .i{fill:currentColor}
.col .frame{background:#fff;border-radius:12px;overflow:hidden;box-shadow:var(--shadow);transition:box-shadow .15s}
.col.on .frame{box-shadow:0 0 0 2px var(--accent),var(--shadow)}
.col .frame.mob{border-radius:3px;box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(28,25,20,.04)}
.col.on .frame.mob{box-shadow:0 0 0 2px var(--accent)}
.col .frame iframe{display:block;width:100%;border:0;background:#fff;min-height:200px}
.dark-client .col .frame,.dark-client .col .frame iframe{background:#121212}

/* code */
.codecard{max-width:1040px;margin:0 auto;background:var(--panel);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;animation:rise .22s var(--ease)}
.codecard header{display:flex;align-items:center;gap:10px;height:42px;padding:0 8px 0 16px;border-bottom:1px solid var(--line-2);font:500 12px/1 var(--mono);color:var(--ink-3)}
.codecard header b{color:var(--ink);font-weight:500}
.codebody{display:flex;overflow:auto}
.gutter,.src{margin:0;padding:14px 0;font:12.5px/1.65 var(--mono);white-space:pre}
.gutter{flex:none;padding-left:14px;padding-right:12px;text-align:right;color:var(--ink-4);user-select:none;border-right:1px solid var(--line-2);background:var(--panel-2)}
.src{flex:1;padding-left:16px;padding-right:24px;color:var(--ink-2);tab-size:2}
.t-t{color:#c2410c} .t-a{color:#7c3aed} .t-s{color:#0f766e} .t-c{color:var(--ink-4);font-style:italic} .t-css{color:#1d4ed8}
:root[data-theme=dark] .t-t{color:#ff9e64} :root[data-theme=dark] .t-a{color:#c4a7ff} :root[data-theme=dark] .t-s{color:#7ee0c3} :root[data-theme=dark] .t-css{color:#8fb3ff}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .t-t{color:#ff9e64}:root:not([data-theme=light]) .t-a{color:#c4a7ff}:root:not([data-theme=light]) .t-s{color:#7ee0c3}:root:not([data-theme=light]) .t-css{color:#8fb3ff}}
.plain{padding:28px 32px 36px;font:13.5px/1.7 var(--mono);white-space:pre-wrap;word-break:break-word;color:var(--ink);max-width:78ch}

/* empty */
.empty{display:grid;place-items:center;min-height:100%;padding:40px 24px;text-align:center}
.empty .art{width:176px;height:128px;margin:0 auto 22px;display:block}
.empty h3{margin:0 0 8px;font:400 34px/1.1 var(--display);letter-spacing:-.01em;color:var(--ink)}
.empty h3 em{font-style:italic}
.empty p{margin:0 auto;max-width:420px;color:var(--ink-2);font-size:14px;line-height:1.55}
.cmd{display:flex;align-items:center;gap:10px;margin:22px auto 0;max-width:max-content;padding:4px 4px 4px 14px;border-radius:11px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow-sm);font:12.5px/1 var(--mono);color:var(--ink)}
.cmd .dollar{color:var(--ink-4)}
.empty small{display:block;margin-top:14px;color:var(--ink-3);font-size:12px}

/* ── review column: variants · stress · lint (pushes the stage, never overlays it) ── */
.side{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden auto;padding:14px 14px 16px;border-left:1px solid var(--line);background:var(--panel-2);scrollbar-width:thin}
.grab{display:none}
.sec{margin-bottom:18px}
.lab{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 4px 8px;font:600 10.5px/1 var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.lab span+span{display:flex;gap:3px;letter-spacing:0;text-transform:none}
.var{position:relative;padding:9px 9px 9px 10px;border-radius:12px;cursor:pointer;transition:background .12s,box-shadow .12s}
.var+.var{margin-top:4px}
.var:hover{background:var(--hover)}
.var.on{background:var(--panel);box-shadow:var(--shadow-sm),inset 0 0 0 1px var(--line)}
.var.on::before{content:"";position:absolute;left:-1px;top:13px;height:22px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.vt{display:flex;align-items:center;gap:10px}
.vl{width:28px;height:28px;flex:none;display:grid;place-items:center;border-radius:8px;background:var(--sunken);color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line-2);font:400 20px/1 var(--display);text-transform:uppercase}
.var.on .vl{background:var(--ink);color:var(--panel);box-shadow:none}
.vn{flex:1;min-width:0}
.vn b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:500;font-size:12.5px;line-height:1.3;letter-spacing:-.005em;color:var(--ink)}
.var:not(.on) .vn b{color:var(--ink-2)}
.st{display:block;margin-top:3px;font:500 10.5px/1.2 var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st.ok{color:var(--ok)} .st.warn{color:var(--warn)} .st.err{color:var(--err)}
.vpick{height:26px;padding:0 10px 0 8px;font-size:11.5px}
.note{display:block;width:100%;margin-top:8px;min-height:32px;padding:6px 10px;border-radius:9px;border:1px solid var(--line-2);outline:0;background:transparent;color:var(--ink);font:12.5px/1.45 var(--font);resize:none;overflow:hidden;transition:border-color .12s,box-shadow .12s,background .12s}
.var.on .note,.note:focus{background:var(--panel)}
.note::placeholder{color:var(--ink-3)}
.note:hover{border-color:var(--line)}
.note:focus{border-color:var(--sel-line);box-shadow:0 0 0 3px var(--sel)}
.solo{padding:10px 12px;border-radius:10px;border:1px dashed var(--line);color:var(--ink-2);font-size:12px;line-height:1.5}
.solo code{font-size:11px;color:var(--ink);word-break:break-word}
.modes{display:flex;flex-direction:column;gap:1px}
.mode{display:flex;align-items:center;gap:10px;width:100%;height:34px;padding:0 4px 0 6px;border-radius:8px;text-align:left;color:var(--ink-2);font-weight:500;font-size:12.5px;transition:background .12s,color .12s}
.mode:hover{background:var(--hover);color:var(--ink)}
.mode>kbd{transition:background .12s,color .12s,border-color .12s}
.mode[aria-pressed=true]{color:var(--ink)}
.mode[aria-pressed=true]>kbd{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.mode .kb0{display:inline-grid;place-items:center;width:18px;height:18px;color:var(--ink-3)}
.mode .kb0 .i{width:14px;height:14px}
.opts{margin-left:auto;display:flex;gap:2px;font:500 11px/1 var(--mono);color:var(--ink-3)}
.opts span{padding:4px 6px;border-radius:5px;transition:background .12s,color .12s}
.opts span:hover{color:var(--ink)}
.opts span.cur{background:var(--panel);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.mode[aria-pressed=true] .opts span.cur{background:var(--sel);color:var(--accent);box-shadow:inset 0 0 0 1px var(--sel-line)}
.phone-only{display:none!important}
.lintrow{display:flex;align-items:center;gap:10px;width:100%;height:36px;padding:0 8px 0 6px;border-radius:10px;border:1px solid var(--line);background:var(--raised);box-shadow:var(--shadow-sm);font-weight:500;font-size:12.5px;color:var(--ink);transition:border-color .12s,background .12s}
.lintrow:hover{border-color:var(--ink-4)}
.lintrow .c{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font:500 11px/1 var(--mono);white-space:nowrap;overflow:hidden}
.lintrow .c::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:currentColor}
.lintrow .c.ok{color:var(--ok)} .lintrow .c.warn{color:var(--warn)} .lintrow .c.err{color:var(--err)} .lintrow .c.none{color:var(--ink-4)}
.lintrow>.i{width:14px;height:14px;color:var(--ink-3)}
.lintrow[aria-expanded=true]{border-color:var(--sel-line);background:var(--sel)}
.lintbody{display:none;margin-top:12px}
.reader.linting .lintbody{display:block}
.linthead{display:flex;align-items:center;gap:8px;margin:0 2px 12px}
.linthead small{flex:1;min-width:0;font:500 11.5px/1 var(--mono);color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hints{margin-top:auto;display:flex;flex-wrap:wrap;gap:8px 12px;padding:12px 2px 0;border-top:1px solid var(--line-2);font-size:11.5px;color:var(--ink-3)}
.hints span{display:inline-flex;align-items:center;gap:5px}

/* lint findings */
.gbtn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--raised);font-size:12px;font-weight:500;color:var(--ink-2);white-space:nowrap;transition:all .12s}
.gbtn:hover{color:var(--ink);border-color:var(--ink-4)}
.gbtn .i{width:14px;height:14px}
.verdict{display:flex;gap:12px;align-items:center;padding:14px;border-radius:12px;margin-bottom:14px}
.verdict .i{width:20px;height:20px;flex:none}
.verdict b{display:block;font-size:14px;letter-spacing:-.01em;color:var(--ink)}
.verdict span{color:var(--ink-2);font-size:12.5px}
.verdict.ok{background:var(--ok-bg);color:var(--ok)} .verdict.warn{background:var(--warn-bg);color:var(--warn)} .verdict.err{background:var(--err-bg);color:var(--err)}
.group{margin:16px 2px 8px;display:flex;align-items:center;gap:8px;font:600 10.5px/1 var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.group .n{font-family:var(--mono);letter-spacing:0}
.f{position:relative;margin:0 0 8px;padding:12px 14px 12px 16px;border-radius:10px;background:var(--panel);border:1px solid var(--line-2);overflow:hidden;animation:rise .2s var(--ease) backwards}
.f::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
.f.error{--c:var(--err)} .f.warn{--c:var(--warn)} .f.info{--c:var(--info)}
.f .h{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:5px;font:500 11px/1 var(--mono);background:var(--panel-2);border:1px solid var(--line-2);color:var(--ink-2)}
.tag.sev{border:0;background:color-mix(in srgb,var(--c) 13%,transparent);color:var(--c);font-weight:600;text-transform:uppercase;letter-spacing:.04em;font-size:10px}
.f p{margin:8px 0 0;font-size:13px;line-height:1.5;color:var(--ink)}
.f code{display:block;margin-top:8px;padding:8px 10px;border-radius:7px;background:var(--sunken);font:11.5px/1.5 var(--mono);color:var(--ink-2);white-space:pre-wrap;word-break:break-all}
.loading{display:flex;align-items:center;gap:10px;padding:14px 4px;color:var(--ink-3)}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── data contract: huecos toggle · case chips · contract card ─────────── */
.seg button[aria-disabled=true]{opacity:.4;cursor:not-allowed}
.seg button[aria-disabled=true]:hover{color:var(--ink-3)}
.hdots{display:none;gap:3px;margin-left:1px}
.hdots i{width:6px;height:6px;border-radius:50%}
#huecosSeg button[aria-pressed=true] .hdots{display:inline-flex}
.hdots .ok,.d.ok{background:var(--ok)} .hdots .warn,.d.warn{background:var(--warn)} .hdots .err,.d.err{background:var(--err)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{display:inline-flex;align-items:center;gap:6px;max-width:100%;height:28px;padding:0 10px 0 4px;border-radius:999px;border:1px solid var(--line-2);background:transparent;color:var(--ink-2);font-weight:500;font-size:12px;transition:background .12s,color .12s,border-color .12s,box-shadow .12s}
.chip:hover{color:var(--ink);border-color:var(--line)}
.chip .av{width:20px;height:20px;font-size:8.5px;box-shadow:none}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--raised);color:var(--ink);border-color:transparent;box-shadow:var(--shadow-sm),inset 0 0 0 1px var(--line)}
.cst{display:flex;flex-wrap:wrap;gap:1px 7px;margin-top:3px;font:500 10.5px/1.25 var(--mono);white-space:nowrap}
.cst .ok{color:var(--ok)} .cst .warn{color:var(--warn)} .cst .err{color:var(--err)}
.ctr{border-radius:12px;background:var(--panel);box-shadow:var(--shadow-sm),inset 0 0 0 1px var(--line);padding:12px 12px 6px}
.ctr.hot{box-shadow:0 0 0 1px var(--sel-line),0 0 0 4px var(--sel)}
.cbar{display:flex;gap:2px;height:6px;border-radius:3px;overflow:hidden;background:var(--sunken)}
.cbar i{min-width:0;transition:flex-grow .2s var(--ease)}
.cbar .ok{background:var(--ok)} .cbar .warn{background:var(--warn)} .cbar .err{background:var(--err)}
.legend{display:grid;grid-template-columns:repeat(3,auto);justify-content:space-between;gap:6px;margin:9px 0 2px;font-size:11.5px;color:var(--ink-3)}
.legend span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.legend .d{width:7px;height:7px;border-radius:50%;flex:none}
.legend b{font:600 12px/1 var(--mono);color:var(--ink);font-variant-numeric:tabular-nums}
.legend .zero{opacity:.55}
.todo{margin:12px -4px 4px;padding:10px 10px 4px;border-radius:9px;background:var(--warn-bg)}
.todo.err{background:var(--err-bg)}
.todo+.todo{margin-top:6px}
.todo-h{display:flex;align-items:center;gap:6px;margin-bottom:8px;font:600 10.5px/1 var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--warn)}
.todo.err .todo-h{color:var(--err)}
.todo-h .n{font-family:var(--mono);letter-spacing:0}
.ep{padding:0 0 8px}
.ep+.ep{padding-top:8px;border-top:1px solid color-mix(in srgb,var(--warn) 18%,transparent)}
.todo.err .ep+.ep{border-top-color:color-mix(in srgb,var(--err) 18%,transparent)}
.ep code,.fs{display:block;font:500 11.5px/1.45 var(--mono);color:var(--ink);overflow-wrap:break-word}
.ep code .mt,.fs .mt{font-weight:600;font-size:10px;letter-spacing:.03em;margin-right:5px;color:var(--ink-3)}
.ep code .pm,.fs .pm{color:var(--ink-3)}
.ep small{display:block;margin-top:3px;font-size:11px;line-height:1.4;color:var(--ink-2)}
.ep small code{display:inline;font-size:10.5px;color:var(--ink-2)}
.done{display:flex;gap:8px;align-items:center;margin:12px -4px 4px;padding:9px 10px;border-radius:9px;background:var(--ok-bg);color:var(--ok);font-size:12px;font-weight:500}
.done .i{width:14px;height:14px}
.ctr-toggle{display:flex;align-items:center;gap:6px;width:calc(100% + 8px);height:32px;margin:6px -4px 0;padding:0 6px;border-radius:8px;color:var(--ink-2);font-weight:500;font-size:12.5px;transition:background .12s,color .12s}
.ctr-toggle:hover{background:var(--hover);color:var(--ink)}
.ctr-toggle .n{font:500 11px/1 var(--mono);color:var(--ink-3)}
.ctr-toggle .i{width:14px;height:14px;margin-left:auto;color:var(--ink-3)}
.fields{display:none;margin:2px -4px 4px}
.ctr.open .fields{display:block}
.fld{display:grid;grid-template-columns:7px minmax(0,1fr) auto;gap:4px 9px;align-items:start;padding:7px 6px;border-radius:8px}
.fld+.fld{border-top:1px solid var(--line-2)}
.fld .d{width:7px;height:7px;border-radius:50%;margin-top:5px}
.fld .fk{display:block;font:600 11.5px/1.45 var(--mono);color:var(--ink);word-break:break-word}
.fld .fs{margin-top:1px;font-size:10.5px;font-weight:400;color:var(--ink-2)}
.fld .fn{display:block;margin-top:2px;font-size:11px;line-height:1.4;color:var(--ink-3);font-style:italic}
.fld .fv{display:flex;gap:2px}
.fld .fv span{display:grid;place-items:center;min-width:17px;height:17px;padding:0 4px;border-radius:5px;background:var(--sunken);font:500 10.5px/1 var(--mono);color:var(--ink-3);text-transform:uppercase}
.fld .fv span.me{background:var(--ink);color:var(--panel)}
.fld.dim .fk,.fld.dim .fs,.fld.dim .d{opacity:.45}
.solo.tpl{margin-bottom:0}
.t-m{color:#b45309;background:rgba(217,119,6,.10);border-radius:3px}
:root[data-theme=dark] .t-m{color:#f5b441;background:rgba(245,180,65,.12)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .t-m{color:#f5b441;background:rgba(245,180,65,.12)}}
.codecard .seg{margin-left:4px}
.codecard .seg button{height:24px;font-size:11.5px;font-family:var(--font)}
.codecard .case{color:var(--ink-3)}

/* ── overlays ───────────────────────────────────────────────────────────── */
.tip{position:fixed;z-index:50;pointer-events:none;padding:6px 8px;border-radius:7px;background:#16161a;color:#f2f2f4;font:500 11.5px/1.35 var(--font);box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:280px;opacity:0;transform:translateY(-2px);transition:opacity .1s,transform .1s;display:flex;gap:8px;align-items:center}
.tip.on{opacity:1;transform:none}
.tip kbd{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.15);color:#fff}
.toast{position:fixed;left:50%;top:18px;z-index:60;transform:translate(-50%,-12px);opacity:0;display:flex;align-items:center;gap:8px;padding:9px 14px 9px 11px;border-radius:12px;background:var(--raised);color:var(--ink);box-shadow:var(--shadow-lg),inset 0 0 0 1px var(--line);font-weight:500;font-size:13px;transition:opacity .15s,transform .15s var(--ease);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast .i{color:var(--ok)}
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,10,12,.28);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .15s}
.scrim.on{opacity:1;pointer-events:auto}
.sheetscrim{position:fixed;inset:0;z-index:44;background:rgba(10,10,12,.3);opacity:0;pointer-events:none;transition:opacity .2s}
.sheetscrim.on{opacity:1;pointer-events:auto}
.keys{width:min(560px,calc(100vw - 32px));background:var(--panel);border-radius:16px;box-shadow:var(--shadow-lg),inset 0 0 0 1px var(--line);padding:6px;transform:scale(.97);transition:transform .15s var(--ease)}
.scrim.on .keys{transform:none}
.keys header{display:flex;align-items:center;padding:12px 10px 4px 16px}
.keys h3{flex:1;margin:0;font:400 26px/1 var(--display)}
.keys .grid{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;padding:4px 16px 16px}
.keys .grp{grid-column:1/-1;margin:14px 0 4px;font:600 10.5px/1 var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.keys .k{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line-2);color:var(--ink-2)}
.keys .k span:last-child{display:flex;gap:3px}

/* ── responsive ─────────────────────────────────────────────────────────── */
.app.nolist .list{display:none}
.app.nolist:not(.focus){grid-template-columns:224px minmax(0,1fr)}
.lbrand{display:none;align-items:center;gap:10px;padding:14px 18px 0}
.lbrand .mark{width:28px;height:28px;border-radius:8px}
.lbrand .wm{font-size:21px}
.lbrand .where{margin:0 0 0 auto;padding:5px 8px;max-width:45%}
@media (max-width:1480px){
  .app:not(.focus){grid-template-columns:60px 340px minmax(0,1fr)}
  .app.nolist:not(.focus){grid-template-columns:60px minmax(0,1fr)}
  .facts{display:none}
  .rail{padding:14px 8px 12px;align-items:center}
  .rail .wm,.rail .where,.navlbl,.nav .lbl,.live span{display:none}
  .brand{padding:4px 0 18px}
  .nav button{width:40px;height:40px;padding:0;justify-content:center;position:relative}
  .nav .n{position:absolute;top:3px;right:1px;margin:0;font-size:9.5px;min-width:15px;height:15px;display:grid;place-items:center;padding:0 3px;border-radius:8px;background:var(--panel);box-shadow:var(--shadow-sm)}
  .nav .n:empty{display:none}
  .rail-foot{flex-direction:column;border:0}
  .live{padding:0 0 6px}
